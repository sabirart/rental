services:
  - type: web
    name: rental-management
    runtime: node
    # Free instances sleep when idle (slow first request). Use a paid plan for real use.
    # Keep one instance unless DATABASE_URL is configured on every instance.
    # With the shared database configured, account writes use PostgreSQL advisory locks.
    plan: free
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must exactly match an "Authorized redirect URI" in Google Cloud Console.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      # >= 32 random characters. Signs sessions and encrypts the Drive refresh-token cookie.
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated extra browser origins allowed to call the API (same-origin needs none).
      - key: CORS_ORIGINS
        sync: false
      # Recommended PostgreSQL primary store for transactional account data, cross-instance write locks, and durable session revocations.
      # Configure the same URL on every instance; existing Drive JSON is imported once and retained as a recovery source.
      - key: DATABASE_URL
        sync: false
      # Optional one-time import from the retired PostgreSQL deployment.
      - key: LEGACY_DATABASE_URL
        sync: false
