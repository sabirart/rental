services:
  - type: web
    name: rental-management
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Paste your Postgres provider's connection string here in the Render
      # dashboard (e.g. from Supabase: Project Settings -> Database ->
      # Connection string). No disk needed - the database is external.
      - key: DATABASE_URL
        sync: false
