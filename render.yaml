services:
  - type: web
    name: rental-management
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional one-time import only. The running application never uses
      # this database for Rental Manager data after migration.
      - key: LEGACY_DATABASE_URL
        sync: false
