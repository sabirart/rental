services:
  - type: web
    name: rental-management
    runtime: node
    # Free instances sleep when idle (slow first request). Use a paid plan for real use.
    # Keep numInstances at 1: data lives in one Google Drive JSON file per user and
    # writes are only serialised/version-checked, not distributed-locked (see README).
    plan: free
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must exactly match an "Authorized redirect URI" in Google Cloud Console.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      # >= 32 random characters. Signs sessions and encrypts the Drive refresh-token cookie.
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated extra browser origins allowed to call the API (same-origin needs none).
      - key: CORS_ORIGINS
        sync: false
      # Optional one-time import from the retired PostgreSQL deployment.
      - key: LEGACY_DATABASE_URL
        sync: false
